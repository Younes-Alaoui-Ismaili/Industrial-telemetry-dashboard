<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Industrial Telemetry Dashboard</title>
    <!--
      First paint, before the bundle exists.

      A visitor used to meet a white page for as long as the JavaScript took to
      arrive and run. This paints the dashboard's own surface instead, so the
      first thing on screen is dark, titled and deliberate rather than blank.

      Everything is inline: no font file, no stylesheet, no image, no request of
      any kind. A layer meant to precede the bundle cannot afford to wait on a
      network round trip of its own, or it arrives after the thing it precedes.

      Colours are the hmi tokens of tailwind.config.js and src/constants/theme.ts,
      written as literals because the CSS bundle is not loaded yet. This is the
      one place in the project where raw hex is unavoidable, so a test in
      src/constants/theme.test.ts asserts every value here belongs to the palette.
    -->
    <style>
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0d0d0d;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #boot-shell .boot-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffffff;
      }

      #boot-shell .boot-subtitle {
        font-size: 12px;
        letter-spacing: 0.02em;
        color: #8f8d86;
      }

      #boot-shell .boot-track {
        position: relative;
        width: 180px;
        height: 2px;
        overflow: hidden;
        background: #232322;
      }

      #boot-shell .boot-runner {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: #8f8d86;
        animation: boot-sweep 1.1s ease-in-out infinite;
      }

      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      /* No motion means no motion: the bar becomes a static partial fill. */
      @media (prefers-reduced-motion: reduce) {
        #boot-shell .boot-runner {
          animation: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Sibling of #root rather than a child. React empties its container on the
      first commit, which would remove this implicitly and leave nothing to grep;
      as a sibling the removal is one explicit line in src/main.tsx.

      Carries no role and no aria-live. It is painted, not announced: the React
      overlay that replaces it is the live region, and two live regions
      overlapping for a frame would announce the same boot twice.
    -->
    <div id="boot-shell">
      <div class="boot-title">Industrial Telemetry Dashboard</div>
      <div class="boot-subtitle">Fleet supervision</div>
      <div class="boot-track"><div class="boot-runner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
