# Adapted from https://thingsboard.io/docs/installation/docker/
# Local demonstration only. Persistent PostgreSQL; no public listener.
name: telemetry-thingsboard
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${TB_DB_PASSWORD:?Set TB_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      TB_SERVICE_ID: telemetry-local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_PASSWORD: ${TB_DB_PASSWORD:?Set TB_DB_PASSWORD}
      TB_QUEUE_TYPE: in-memory
      JAVA_OPTS: "-Xms512m -Xmx2048m"
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
